# Builds, tests and publishes obur's three images to GitHub's registry when a version is tagged (v1.0.0), as
# ghcr.io/aloglu/obur, obur-speech and obur-labels with the version and `latest`. Pushes to branches run nothing, to
# keep Actions use small. Run it by hand (Actions → Release → Run workflow) to build and test without publishing.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      # The development settings from .env.example, for the database tests.
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: obur_admin
          POSTGRES_PASSWORD: change-me-admin
          POSTGRES_DB: obur
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U obur_admin -d obur" --health-interval 5s --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$PUBLISH" = "true" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 24.11.0
          cache: npm
      - run: npm install -g npm@11.19.0 --no-audit --no-fund && npm ci --no-audit --no-fund
      - run: cp .env.example .env
      - run: npm run lint
      - run: npm run check
      - name: Unit, rule and database tests
        run: npx vitest run

  images:
    name: Image ${{ matrix.image }}
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: obur
            context: .
          - image: obur-speech
            context: speech
          - image: obur-labels
            context: labels
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.image }}:test
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Smoke test
        if: matrix.image == 'obur'
        run: deploy/obur/smoke-test.sh obur:test
      - name: Publish
        if: env.PUBLISH == 'true'
        env:
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          target="$REGISTRY/${{ matrix.image }}"
          for tag in "$VERSION" latest; do
            docker tag "${{ matrix.image }}:test" "$target:$tag"
            docker push "$target:$tag"
          done
