# Tests and publishes obur's three images to GitHub's registry when a version is tagged (v1.0.0), as
# ghcr.io/aloglu/obur, obur-speech and obur-labels with the version and `latest`, then a GitHub release for it.
# Nothing is published unless the checks, the browser tests and every image's tests pass (obur: smoke, off-site
# outage and restore, upgrade and restore; add-ons: one input each), and then all three together. A test release
# (v1.0.0-beta.1) is published under its own version only, never as `latest`. Pushes to branches run nothing. Run it
# by hand (Actions → Release → Run workflow) to build and test without publishing.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    services:
      # The development settings from .env.example, for the database tests.
      postgres:
        image: postgres:18.7-trixie
        env:
          POSTGRES_USER: obur_admin
          POSTGRES_PASSWORD: change-me-admin
          POSTGRES_DB: obur
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U obur_admin -d obur" --health-interval 5s --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$PUBLISH" = "true" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: cp .env.example .env
      - run: npm run lint
      - run: npm run check
      - name: Unit, rule and database tests
        run: npx vitest run

  e2e:
    # The browser journeys on phone-size WebKit and desktop Chromium, through `npm run test:e2e` as locally.
    name: Browser tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7-trixie
        env:
          POSTGRES_USER: obur_admin
          POSTGRES_PASSWORD: change-me-admin
          POSTGRES_DB: obur
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U obur_admin -d obur" --health-interval 5s --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.3
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: cp .env.example .env
      # In Playwright's official image, exactly as locally: browsers installed straight on Ubuntu rendered WebKit's dark
      # mode differently (rc.2's run). Host networking reaches the PostgreSQL service on localhost.
      # One worker: two on the runner starved WebKit, which stopped drawing mid-test (reproduced with 2 CPUs and more
      # workers than that; one worker on 2 CPUs passed everything in 16 min). One retry: a test that passes only on
      # its second try is reported as flaky, never hidden.
      - run: npm run test:e2e -- --workers=1 --retries=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  images:
    # Build and test only: no job but Publish can write to the registry (2026-11-20 audit, R03).
    name: Image ${{ matrix.image }}
    needs: [checks, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      # One failed image stops the others: nothing is published unless all three pass.
      fail-fast: true
      matrix:
        include:
          - image: obur
            context: .
          - image: obur-speech
            context: speech
            addon: speech
          - image: obur-labels
            context: labels
            addon: labels
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ matrix.image }}:test
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Smoke test
        if: matrix.image == 'obur'
        run: deploy/obur/smoke-test.sh obur:test
      - name: Off-site outage test
        if: matrix.image == 'obur'
        run: deploy/obur/offsite-test.sh obur:test
      - name: Off-site restore on a new server test
        if: matrix.image == 'obur'
        run: deploy/obur/offsite-restore-test.sh obur:test
      # Real data from an older release updated by this image, then that release's backup restored (with its replay
      # held paused) and a deletion list reapplied. beta.19 is the last version before foods became private.
      - name: Upgrade and restore test
        if: matrix.image == 'obur'
        run: deploy/obur/upgrade-test.sh ghcr.io/${{ github.repository_owner }}/obur:1.0.0-beta.19 obur:test
      - name: Add-on test
        if: matrix.addon
        run: deploy/addon-test.sh ${{ matrix.image }}:test ${{ matrix.addon }}
      # The tested image itself goes to Publish, so the registry gets exactly what passed.
      - name: Keep the tested image
        if: env.PUBLISH == 'true'
        run: docker save ${{ matrix.image }}:test | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: image-${{ matrix.image }}
          path: image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    # Runs only once all three images passed. The version goes first; `latest` moves only after all three versioned
    # images can be pulled; the GitHub release, which installations read for "a new version is available", comes
    # last (R11).
    name: Publish
    needs: [checks, images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      IMAGES: obur obur-speech obur-labels
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: images
      - name: Load the tested images
        run: for f in images/*/image.tar.gz; do gunzip -c "$f" | docker load; done
      - name: Push the version
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in $IMAGES; do
            docker tag "$image:test" "$REGISTRY/$image:$VERSION"
            docker push "$REGISTRY/$image:$VERSION"
          done
      - name: Check the version can be pulled
        run: |
          docker logout ghcr.io
          for image in $IMAGES; do docker manifest inspect "$REGISTRY/$image:$VERSION" >/dev/null; done
      - name: Move latest
        # Test releases (a version with a hyphen) never become `latest`.
        if: ${{ !contains(needs.checks.outputs.version, '-') }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in $IMAGES; do
            docker tag "$image:test" "$REGISTRY/$image:latest"
            docker push "$REGISTRY/$image:latest"
          done
      - name: Release record
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=()
          [[ $VERSION == *-* ]] && pre=(--prerelease)
          gh release create "v$VERSION" --repo "${{ github.repository }}" --verify-tag "${pre[@]}" \
            --title "obur $VERSION" \
            --notes "Images: $REGISTRY/obur:$VERSION, obur-speech:$VERSION, obur-labels:$VERSION. Updating: docs/install/updating.md."
