# obur: who may connect to the database inside the container.
# The administrator only as the postgres system user, over the socket (backups, restores, start-up).
local   all   obur_admin                 peer map=obur
local   all   all                        reject
# The app's roles over loopback with their passwords. The administrator never over the network.
host    all   obur_admin   127.0.0.1/32  reject
host    all   all          127.0.0.1/32  scram-sha-256
