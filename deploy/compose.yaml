# obur with Docker Compose: copy this file and .env.example (as .env) into one folder, fill in .env, then run
#   docker compose up -d
# The guide is docs/install/docker.md. Speak and Scan are optional: remove their services (and the two URLs) to
# leave them out.
name: obur

services:
  obur:
    image: ${OBUR_REGISTRY-ghcr.io/aloglu/}obur:${OBUR_VERSION:-latest}
    container_name: obur
    restart: unless-stopped
    env_file: ${OBUR_ENV_FILE:-.env}
    environment:
      # Speak and Scan, through the add-ons below. Empty switches them off.
      SPEECH_URL: ${SPEECH_URL-http://obur-speech:8000}
      LABELS_URL: ${LABELS_URL-http://obur-labels:8000}
    ports:
      # 127.0.0.1: only this machine (for a tunnel or reverse proxy on it). 0.0.0.0: every device that can reach it.
      - '${OBUR_BIND_ADDRESS:-127.0.0.1}:${OBUR_PORT:-8040}:3000'
    volumes:
      # Everything obur keeps: the database, generated passwords, backup health. Keep this folder.
      - ${OBUR_DATA_DIR:-./data}:/data
      # The encrypted backups: inside the data folder unless OBUR_BACKUP_DIR puts them elsewhere (another disk is
      # better: a failing disk then takes only one of the two).
      - ${OBUR_BACKUP_DIR:-./data/backups}:/data/backups
    shm_size: 256mb
    # Room for the database to shut down cleanly.
    stop_grace_period: 60s
    networks: [default, addons]

  # Speech to text for Speak: audio in memory only, nothing logged, no internet.
  obur-speech:
    image: ${OBUR_REGISTRY-ghcr.io/aloglu/}obur-speech:${OBUR_VERSION:-latest}
    container_name: obur-speech
    restart: unless-stopped
    networks: [addons]
    environment:
      SPEECH_THREADS: ${SPEECH_THREADS:-4}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: ${SPEECH_MEMORY_LIMIT:-2g}

  # Label reading for Scan: photos in memory only, nothing logged, no internet.
  obur-labels:
    image: ${OBUR_REGISTRY-ghcr.io/aloglu/}obur-labels:${OBUR_VERSION:-latest}
    container_name: obur-labels
    restart: unless-stopped
    networks: [addons]
    environment:
      OCR_THREADS: ${LABELS_THREADS:-4}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: ${LABELS_MEMORY_LIMIT:-1g}

networks:
  # Shared only by obur and its add-ons, with no way out to the internet.
  addons:
    internal: true
